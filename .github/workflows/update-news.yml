name: Update marine news

on:
  schedule:
    # 7am UK time in winter (GMT, UTC+0)
    - cron: "17 7 * * *"
    # 7am UK time in summer (BST, UTC+1)
    - cron: "17 6 * * *"
    # 1pm UK time in winter (GMT, UTC+0)
    - cron: "17 13 * * *"
    # 1pm UK time in summer (BST, UTC+1)
    - cron: "17 12 * * *"
  workflow_dispatch: {}
    # ^ lets you trigger this manually from the "Actions" tab on GitHub, useful for testing

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch news and build news.json
        run: python fetch_news.py

      - name: Commit and push news.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --quiet --cached || git commit -m "Update news.json ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git pull --rebase origin main
          git push
