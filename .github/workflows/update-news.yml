name: Update marine news

on:
  schedule:
    # 6am Paris time in winter (CET, UTC+1) = 05:00 UTC
    - cron: "0 5 * * *"
    # 6am Paris time in summer (CEST, UTC+2) = 04:00 UTC
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch news and build news.json
        run: python fetch_news.py

      - name: Commit and push news.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --quiet --cached || git commit -m "Update news.json ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git pull --rebase origin main
          git push
